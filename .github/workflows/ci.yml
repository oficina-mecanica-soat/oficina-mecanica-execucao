              calls.push(args);const op=args[1],get=key=>args[args.indexOf(key)+1];
              if(op==='get-caller-identity')return {Account:falha==='conta'?'999999999999':account};
              if(op==='get-parameter'){const name=get('--name').split('/').at(-1);return {Parameter:{Value:name==='execucao'?'ready':c[name]}};}
