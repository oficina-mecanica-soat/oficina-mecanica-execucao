name: "🧪 CI"
run-name: "🧪 Validar código · ${{ github.head_ref || github.ref_name }}"

on:
  pull_request:
    branches:
      - develop
      - release
      - "release/**"
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  detect_ci_scope:
    name: "🔎 00 · Detectar escopo do PR"
    runs-on: ubuntu-latest
    outputs:
      ci_required: ${{ steps.detect.outputs.ci_required }}

    steps:

      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "🔍 02 · Analisar arquivos alterados"
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ci_required=false
          changed_files="$(mktemp)"

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_files"

          if [ ! -s "$changed_files" ]; then
            echo "No changed files found. Running full CI for safety."
            ci_required=true
          else
            echo "Changed files:"
            cat "$changed_files"

            while IFS= read -r file; do
              case "$file" in
                *.md)
                  ;;
                *)
                  ci_required=true
                  break
                  ;;
              esac
            done < "$changed_files"
          fi

          echo "ci_required=$ci_required" >> "$GITHUB_OUTPUT"
          echo "CI required: $ci_required"

  validate_git_flow:
    name: "🔀 01 · Validar fluxo de branches"
    runs-on: ubuntu-latest

    steps:

      - name: "📥 Conferir estrutura do repositório"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "📁 Bloquear pastas extras e diretórios de scripts"
        run: |
          node <<'VALIDAR_ESTRUTURA'
          const cp = require('node:child_process');
          const nomes = args => cp.execFileSync('git', args, { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          const assert = require('node:assert/strict');
          // Estrutura aprovada do projeto, válida também em promoções para branches antigas.
          const raizes = new Set([".agents", ".github", "docs", "infra", "k8s", "src", "tests"]);
          function foraDoPadrao(arquivos) {
            return arquivos.filter(nome => {
              const pastas = nome.split('/').slice(0, -1);
              return pastas.some(pasta => pasta.toLowerCase() === 'scripts') || (pastas.length > 0 && !raizes.has(pastas[0]));
            });
          }
          assert.deepEqual(foraDoPadrao(['src/Caso/Novo.cs']), []);
          assert.deepEqual(foraDoPadrao(['scripts/local.ps1', '.github/scripts/check.cjs', 'pasta-extra/arquivo']), ['scripts/local.ps1', '.github/scripts/check.cjs', 'pasta-extra/arquivo']);
          const invalidos = foraDoPadrao(nomes(['ls-files']));
          if (invalidos.length) throw new Error('Estrutura fora do padrão aprovado: ' + invalidos.join(', '));
          console.log('Estrutura existente preservada; nenhuma pasta de scripts versionada.');
          VALIDAR_ESTRUTURA

      - name: "🧪 Validar promoção cumulativa sem AWS"
        run: |
          node <<'TESTAR_PROMOCAO_CUMULATIVA'
          const fs = require('node:fs');
          const path = require('node:path');
          const os = require('node:os');
          const cp = require('node:child_process');
          const assert = require('node:assert/strict');
          const workflow = fs.readFileSync('.github/workflows/cd-development.yml', 'utf8');
          const bloco = workflow.match(/node <<'VALIDAR_PROMOCAO_CUMULATIVA'\r?\n([\s\S]*?)          VALIDAR_PROMOCAO_CUMULATIVA/);
          assert(bloco, 'Guarda cumulativa ausente.');
          const codigo = bloco[1].split(/\r?\n/).map(l => l.slice(10)).join('\n');
          const validar = new Function(codigo.split('// Execução no runner:')[0] + '; return validarPromocao;')();
          const detector = workflow.match(/node <<'DETECTAR_DEPLOY'\r?\n([\s\S]*?)          DETECTAR_DEPLOY/)[1].split(/\r?\n/).map(l => l.slice(10)).join('\n');
          const caminhos = JSON.parse(workflow.match(/DEPLOYABLE_PATHS: >-\r?\n((?:    [^\n]*\r?\n)+)/)[1]);
          const diretorio = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP || os.tmpdir(), 'promocao-cumulativa-'));
          try {
            const git = args => cp.execFileSync('git', args, { cwd: diretorio, encoding: 'utf8' }).trim();
            git(['init', '-b', 'develop']);
            git(['config', 'user.email', 'teste@example.invalid']);
            git(['config', 'user.name', 'Teste local']);
            const gravar = (nome, conteudo) => {
              fs.mkdirSync(path.dirname(path.join(diretorio, nome)), { recursive: true });
              fs.writeFileSync(path.join(diretorio, nome), conteudo);
              git(['add', nome]);
              git(['commit', '-m', 'cenário local']);
              return git(['rev-parse', 'HEAD']);
            };
            const base = gravar('README.md', 'base');
            const docs = gravar('README.md', 'documentação');
            const consultarNunca = () => { throw new Error('Consulta inesperada.'); };
            const opcoes = { git, caminhos, base, head: docs, consultar: consultarNunca };
            assert.equal(validar(opcoes), 'SEM_ALTERACAO_IMPLANTAVEL');

            git(['switch', '-c', 'feature/teste']);
            gravar('src/Exemplo.cs', 'código');
            git(['switch', 'develop']);
            git(['merge', '--no-ff', 'feature/teste', '-m', 'merge funcional']);
            const implantavel = git(['rev-parse', 'HEAD']);
            const head = gravar('README.md', 'documentação depois do código');
            const detectar = (antes, atual) => {
              const saida = path.join(diretorio, 'saida-runner.txt');
              fs.writeFileSync(saida, '');
              cp.execFileSync(process.execPath, ['-e', detector], {
                cwd: diretorio,
                env: { ...process.env, DEPLOYABLE_PATHS: JSON.stringify(caminhos), GITHUB_BEFORE: antes, GITHUB_SHA: atual, GITHUB_OUTPUT: saida }
              });
              return fs.readFileSync(saida, 'utf8').trim();
            };
            assert.equal(detectar(base, implantavel), 'deploy_required=true');
            assert.equal(detectar(implantavel, head), 'deploy_required=false');
            let chamadas = [];
            const run = { id: 123, run_attempt: 2, head_sha: implantavel, head_branch: 'develop', event: 'push', status: 'completed', conclusion: 'success' };
            const job = { name: '☁️ 02 · Deploy em development / ☁️ 04 · Aplicar ou destruir infraestrutura', conclusion: 'success' };
            const consultar = endpoint => {
              chamadas.push(endpoint);
              return endpoint.startsWith('actions/workflows/') ? [{ workflow_runs: [run] }] : [{ jobs: [job] }];
            };
            const comCodigo = { ...opcoes, head, consultar };
            assert.throws(() => validar({ ...comCodigo, consultar: () => [{ workflow_runs: [] }] }), /sem CD/);
            assert.equal(validar(comCodigo), 'OPERACAO_ANTERIOR_CONFIRMADA');
            assert(chamadas[0].includes('head_sha=' + implantavel), 'Deve buscar o merge em develop, não o commit da feature/documentação.');
            assert(chamadas[1].includes('/attempts/2/jobs'), 'Deve consultar a tentativa atual.');
            for (const estado of ['skipped', 'failure', 'cancelled']) {
              job.conclusion = estado;
              assert.throws(() => validar(comCodigo), /sem aplicação/);
            }
            job.conclusion = 'success';
            assert.throws(() => validar({ ...comCodigo, consultar: endpoint => endpoint.startsWith('actions/workflows/') ? [{ workflow_runs: [run] }] : [{}] }), /Jobs/);
            assert.throws(() => validar({ ...comCodigo, consultar: endpoint => [{ workflow_runs: [{ ...run, head_sha: '0'.repeat(40) }] }] }), /sem CD/);
            assert.throws(() => validar({ ...comCodigo, consultar: endpoint => [{ workflow_runs: [run, { ...run, id: 124, conclusion: 'failure' }] }] }), /sem CD/);
            run.conclusion = 'failure';
            assert.throws(() => validar(comCodigo), /sem CD/);
            run.conclusion = 'success';
            run.status = 'in_progress';
            assert.throws(() => validar(comCodigo), /sem CD/);
            run.status = 'completed';
            assert.throws(() => validar({ ...comCodigo, consultar: consultarNunca }), /Consulta inesperada/);
            assert.throws(() => validar({ ...comCodigo, consultar: () => ({}) }), /Histórico/);
            assert.equal(validar({ ...comCodigo, consultar: consultarNunca, resultadoAtual: 'success', acaoAtual: 'apply' }), 'OPERACAO_ATUAL_CONFIRMADA');
            assert.equal(validar({ ...comCodigo, consultar: consultarNunca, resultadoAtual: 'success', acaoAtual: 'destroy' }), 'OPERACAO_ATUAL_CONFIRMADA');
            assert.throws(() => validar({ ...comCodigo, consultar: consultarNunca, resultadoAtual: 'skipped', acaoAtual: 'apply' }), /Consulta inesperada/);
            gravar('src/Exemplo.cs', 'outro código ainda sem deploy');
            const posterior = gravar('README.md', 'mais documentação');
            assert.throws(() => validar({ ...comCodigo, head: posterior }), /sem CD/);
            gravar('src/Exemplo.cs', 'código');
            assert.equal(validar({ ...comCodigo, base: implantavel, head: git(['rev-parse', 'HEAD']), consultar: consultarNunca }), 'SEM_ALTERACAO_IMPLANTAVEL');
            console.log('Promoção cumulativa: código sem deploy bloqueado; código implantado seguido de docs permitido; falhas, skips, reruns e novo código protegidos.');
          } finally {
            assert.equal(path.dirname(fs.realpathSync(diretorio)), fs.realpathSync(process.env.RUNNER_TEMP || os.tmpdir()));
            fs.rmSync(diretorio, { recursive: true, force: true });
          }
          TESTAR_PROMOCAO_CUMULATIVA

      - name: "🔀 01 · Conferir origem e destino do PR"
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          echo "Base branch: $BASE_BRANCH"
          echo "Head branch: $HEAD_BRANCH"

          case "$BASE_BRANCH" in
            develop)
              case "$HEAD_BRANCH" in
                main|release|release/*)
                  echo "Protected stage branches must not open pull requests back to develop."
                  exit 1
                  ;;
                *)
                  echo "Pull request to develop follows the Git Flow entry point."
                  ;;
              esac
              ;;

            release|release/*)
              if [ "$HEAD_BRANCH" != "develop" ]; then
                echo "Pull requests to release must come from develop."
                exit 1
              fi

              echo "Pull request to release follows the Git Flow promotion path."
              ;;

            main)
              case "$HEAD_BRANCH" in
                release|release/*)
                  echo "Pull request to main follows the Git Flow production promotion path."
                  ;;
                *)
                  echo "Pull requests to main must come from release or release/*."
                  exit 1
                  ;;
              esac
              ;;

            *)
              echo "Unsupported protected base branch: $BASE_BRANCH"
              exit 1
              ;;
          esac

  build_application:
    name: "🏗️ 02 · Build da aplicação"
    needs: detect_ci_scope
    if: needs.detect_ci_scope.outputs.ci_required == 'true'
    runs-on: ubuntu-latest

    steps:

      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🛠️ 02 · Instalar SDK do .NET"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "📦 03 · Restaurar cache de pacotes NuGet"
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "📚 04 · Resolver dependências do projeto (dotnet restore)"
        run: dotnet restore OficinaMecanica.Execucao.sln

      - name: "🔨 05 · Compilar a solução"
        run: dotnet build OficinaMecanica.Execucao.sln --configuration Release --no-restore -warnaserror

  verify_code_style:
    name: "🎨 03 · Verificar padrão de código"
    needs: detect_ci_scope
    if: needs.detect_ci_scope.outputs.ci_required == 'true'
    runs-on: ubuntu-latest

    steps:

      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🛠️ 02 · Instalar SDK do .NET"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "📚 03 · Resolver dependências do projeto (dotnet restore)"
        run: dotnet restore OficinaMecanica.Execucao.sln

      - name: "✅ 04 · Verificar formatação do código"
        run: dotnet format OficinaMecanica.Execucao.sln --verify-no-changes --no-restore

  test_application:
    name: "🧪 04 · Testar aplicação"
    needs: detect_ci_scope
    if: needs.detect_ci_scope.outputs.ci_required == 'true'
    runs-on: ubuntu-latest

    steps:

      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🛠️ 02 · Instalar SDK do .NET"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "📦 03 · Restaurar cache de pacotes NuGet"
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.sln', '**/*.csproj', '**/*.props', '**/*.targets') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: "📚 04 · Resolver dependências do projeto (dotnet restore)"
        run: dotnet restore OficinaMecanica.Execucao.sln

      - name: "🔨 05 · Compilar a solução"
        run: dotnet build OficinaMecanica.Execucao.sln --configuration Release --no-restore -warnaserror

      - name: "🧪 06 · Executar testes com cobertura"
        run: >
          dotnet test OficinaMecanica.Execucao.sln
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --settings tests/sonarqube.runsettings
          --results-directory ./TestResults
          --logger "trx"

      - name: "🔍 07 · Validar resultados dos testes"
        shell: pwsh
        run: |
          $trxFiles = Get-ChildItem -Path TestResults -Recurse -Filter *.trx

          if (-not $trxFiles) {
            throw "No TRX test result files were generated."
          }

          $total = 0
          $passed = 0
          $failed = 0
          $skipped = 0

          foreach ($trxFile in $trxFiles) {
            [xml]$trx = Get-Content -LiteralPath $trxFile.FullName
            $counters = $trx.TestRun.ResultSummary.Counters

            $total += [int]$counters.total
            $passed += [int]$counters.passed
            $failed += [int]$counters.failed
            $skipped += [int]$counters.notExecuted
          }

          Write-Host "Tests: total=$total passed=$passed failed=$failed skipped=$skipped"

          if ($total -eq 0) {
            throw "Nenhum teste foi executado."
          }

          if ($failed -gt 0) {
            throw "There are failing tests."
          }

          if ($skipped -gt 0) {
            throw "CI coverage requires zero skipped tests. Check Docker availability before collecting coverage."
          }

      - name: "📊 08 · Gerar relatório de cobertura"
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"TestResults/CoverageReport" \
            -reporttypes:"HtmlInline_AzurePipelines;Cobertura;MarkdownSummaryGithub"

      - name: "📈 09 · Validar limite mínimo de cobertura"
        shell: pwsh
        run: |
          [xml]$coverage = Get-Content -LiteralPath TestResults/CoverageReport/Cobertura.xml
          $lineRate = [double]::Parse($coverage.coverage.'line-rate', [System.Globalization.CultureInfo]::InvariantCulture)
          $lineCoverage = [math]::Round($lineRate * 100, 2)

          Write-Host "Line coverage: $lineCoverage%"

          if ($lineCoverage -lt 90) {
            throw "Line coverage $lineCoverage% is below the required 90% threshold."
          }

      - name: "⬆️ 10 · Publicar artefatos de teste e cobertura"
        uses: actions/upload-artifact@v7
        with:
          name: test-and-coverage-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
            TestResults/CoverageReport/**
          if-no-files-found: error

  build_container_image:
    name: "🐳 05 · Build da imagem Docker"
    needs: detect_ci_scope
    if: needs.detect_ci_scope.outputs.ci_required == 'true'
    runs-on: ubuntu-latest

    steps:

      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🛠️ 02 · Configurar Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "🔨 03 · Compilar imagem Docker"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: oficina-mecanica-execucao:ci
          outputs: type=docker,dest=${{ runner.temp }}/execucao-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "🧾 04 · Identificar o conteúdo validado"
        run: git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/source-tree.txt"

      - name: "⬆️ 05 · Publicar imagem para o CD"
        if: github.base_ref == 'develop'
        uses: actions/upload-artifact@v7
        with:
          name: execucao-image-pr-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/execucao-image.tar
            ${{ runner.temp }}/source-tree.txt
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  validate_kubernetes_manifests:
    name: "☸️ 06 · Validar manifests Kubernetes"
    needs: detect_ci_scope
    if: needs.detect_ci_scope.outputs.ci_required == 'true'
    runs-on: ubuntu-latest

    steps:

      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🛠️ 02 · Instalar kubectl"
        uses: azure/setup-kubectl@v5

      - name: "🌀 03 · Criar cluster Kind efêmero"
        uses: helm/kind-action@v1
        with:
          cluster_name: ci-validation

      - name: "🔍 04 · Validar manifests com dry-run"
        run: kubectl apply --dry-run=client -R -f k8s/

  validate_terraform:
    name: "🌐 Validar Terraform do Execução"
    needs: detect_ci_scope
    if: needs.detect_ci_scope.outputs.ci_required == 'true'
    runs-on: ubuntu-latest
    steps:

      - name: "📥 01 · Baixar código do repositório"
        uses: actions/checkout@v7

      - name: "🛠️ 02 · Instalar SDK do .NET"
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: "🧪 Validar adaptador temporário de inspeção da DLQ"
        run: |
          node <<'TESTAR_ADAPTADOR_DLQ'
          const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),assert=require('node:assert/strict');
          const origem=fs.readFileSync('.github/workflows/aws-deploy.yml','utf8');
          const cs=origem.match(/          cat > "\$RUNNER_TEMP\/inspecao-dlq\/Program.cs" <<'CSHARP_INSPECAO'\r?\n([\s\S]*?)          CSHARP_INSPECAO/);
          const projeto=origem.match(/          cat > "\$RUNNER_TEMP\/inspecao-dlq\/Inspecao.csproj" <<EOF\r?\n([\s\S]*?)          EOF/);
          if(!cs || !projeto)throw Error('Adaptador ausente');
          const dir=path.join(process.env.RUNNER_TEMP,'inspecao-dlq');fs.mkdirSync(dir,{recursive:true});
          const desindentar=texto=>texto.split(/\r?\n/).map(l=>l.slice(10)).join('\n');
          fs.writeFileSync(path.join(dir,'Program.cs'),desindentar(cs[1]));
          fs.writeFileSync(path.join(dir,'Inspecao.csproj'),desindentar(projeto[1]).replaceAll('$GITHUB_WORKSPACE',process.cwd().replaceAll('\\','/')));
          cp.execFileSync('dotnet',['build',path.join(dir,'Inspecao.csproj'),'-c','Release','--output',path.join(dir,'bin')],{stdio:'inherit'});
          const id='11111111-1111-1111-1111-111111111111';
          const mensagem={mensagemId:id,tipo:'AutorizarExecucao',versao:1,sagaId:id,ordemServicoId:id,correlationId:'teste-adaptador',causationId:id,ocorridoEm:'2026-11-12T12:00:00Z',dados:{preparacaoId:id,versaoOrcamento:1}};
          const executar=input=>cp.spawnSync('dotnet',[path.join(dir,'bin','Inspecao.dll')],{input:JSON.stringify(input),encoding:'utf8'});
          const valido=executar(mensagem);assert.equal(valido.status,0,valido.stderr);
          const info=JSON.parse(valido.stdout);assert.deepEqual(Object.keys(info).sort(),['hashNegocio','mensagemId','ordemServicoId']);
          assert.equal(info.mensagemId,id);assert.equal(info.ordemServicoId,id);assert.match(info.hashNegocio,/^[A-F0-9]{64}$/);
          const invalido=executar({...mensagem,versao:2});assert.notEqual(invalido.status,0);assert.equal(invalido.stdout,'');
          assert(!invalido.stderr.includes(id));console.log('Adaptador usa a aplicação e não expõe corpo em falhas.');
          TESTAR_ADAPTADOR_DLQ

      - name: "🛠️ 03 · Instalar Terraform"
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: "🧪 Validar recuperação segura de destroy"
        run: |
          node <<'PREPARAR_TESTES_INLINE'
          const fs = require('node:fs');
          const path = require('node:path');
          const origem = fs.readFileSync('.github/workflows/aws-deploy.yml', 'utf8');
          // Extrai os mesmos blocos literais usados pelo CD; não mantém outra cópia da lógica.
          const blocos = [...origem.matchAll(/^([ ]*)cat > "\$RUNNER_TEMP\/([^"\/]+\.cjs)" <<'(VALIDACAO_INLINE_\d+)'\r?\n([\s\S]*?)^\1\3\r?$/gm)];
          const esperados = ["bootstrap-account-state.cjs", "preparar-ambiente-execucao.cjs", "prepare-destroy.cjs", "validar-ownership-plano.cjs", "verificar-infra-execucao.cjs", "operacao-dlq.cjs"];
          if (blocos.length !== esperados.length || !esperados.every(nome => blocos.some(bloco => bloco[2] === nome))) throw new Error('Blocos de validação ausentes ou divergentes.');
          for (const bloco of blocos) {
            const codigo = bloco[4].split('\n').map(linha => linha.slice(bloco[1].length)).join('\n');
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, bloco[2]), codigo);
          }
          PREPARAR_TESTES_INLINE
          cat > "$RUNNER_TEMP/bootstrap-account-state.test.cjs" <<'TESTE_INLINE_0'
          const {test}=require('node:test');
          const assert=require('node:assert/strict');
          const {checkEmpty,consultarAws}=require('./bootstrap-account-state.cjs');
          test('bootstrap rejeita recursos do projeto e respostas inválidas',()=>{
            assert.throws(()=>checkEmpty('VPC',[{Tags:[{Key:'Project',Value:'OficinaMecanica'}]}]),/bloqueado/);
            assert.throws(()=>checkEmpty('Lambda',[{FunctionName:'oficina-mecanica-auth-lambda-dev'}]),/bloqueado/);
            assert.throws(()=>checkEmpty('EKS',null),/inválida/);
            checkEmpty('Lambda',[{FunctionName:'MainMonitoringFunction'}]);
            checkEmpty('VPC',[{IsDefault:true}]);
          });
          test('SQS sem filas aceita stdout vazio somente depois de sucesso da CLI',()=>{
